# GitHub Actions CI — ADK Skills & Agents
#
# Gates every change on: manifest parseability, skill frontmatter/spec
# conformance, Python/Go/TS syntax, and the ADK version matrix.
#
# Target: google-adk >= 2.9.2, validated through 2.12.0.
# Python floor is 3.10 for 2.9.2-2.11.0 and 3.11 for 2.12.0.

name: ADK Skills CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly dependency/model refresh check — Monday 09:00 UTC
    - cron: "37 9 * * 1"

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ── Every JSON and YAML file must parse ──
  validate-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install parsers
        run: pip install pyyaml

      - name: Parse all JSON and YAML
        run: |
          python - <<'PY'
          import json, pathlib, sys
          import yaml

          errors = []
          for p in pathlib.Path('.').rglob('*.json'):
              if '.git' in p.parts:
                  continue
              try:
                  json.loads(p.read_text(encoding='utf-8'))
              except Exception as e:
                  errors.append(f'{p}: {e}')

          for p in list(pathlib.Path('.').rglob('*.yaml')) + list(pathlib.Path('.').rglob('*.yml')):
              if '.git' in p.parts:
                  continue
              try:
                  yaml.safe_load(p.read_text(encoding='utf-8'))
              except Exception as e:
                  errors.append(f'{p}: {e}')

          for e in errors:
              print(f'ERROR: {e}')
          sys.exit(1 if errors else 0)
          PY

  # ── Skill spec conformance ──
  validate-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install parsers
        run: pip install pyyaml

      - name: Validate every skill
        run: |
          python - <<'PY'
          import pathlib, re, sys
          import yaml

          NAME_RE = re.compile(r'^[a-z0-9]+(-[a-z0-9]+)*$')
          errors = []
          count = 0

          for skill_dir in sorted(pathlib.Path('skills').iterdir()):
              if not skill_dir.is_dir():
                  continue
              count += 1
              md = skill_dir / 'SKILL.md'
              if not md.exists():
                  errors.append(f'{skill_dir}: missing SKILL.md')
                  continue

              text = md.read_text(encoding='utf-8')
              m = re.match(r'^---\n(.*?)\n---', text, re.S)
              if not m:
                  errors.append(f'{skill_dir}: missing YAML frontmatter')
                  continue

              fm = yaml.safe_load(m.group(1)) or {}
              name = fm.get('name')
              desc = fm.get('description')

              if not name:
                  errors.append(f'{skill_dir}: frontmatter missing name')
              else:
                  if name != skill_dir.name:
                      errors.append(f'{skill_dir}: name {name!r} != directory name')
                  if not NAME_RE.match(str(name)):
                      errors.append(f'{skill_dir}: name {name!r} is not kebab-case')
                  if len(str(name)) > 64:
                      errors.append(f'{skill_dir}: name exceeds 64 chars')

              if not desc:
                  errors.append(f'{skill_dir}: frontmatter missing description')
              elif len(str(desc)) > 1024:
                  errors.append(f'{skill_dir}: description exceeds 1024 chars ({len(str(desc))})')

              if 'compatibility' not in fm:
                  errors.append(f'{skill_dir}: frontmatter missing compatibility')

          print(f'Validated {count} skills')
          for e in errors:
              print(f'ERROR: {e}')
          sys.exit(1 if errors else 0)
          PY

  # ── Python + Go + TypeScript syntax across the repo ──
  lint-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Python syntax (all files)
        run: |
          python - <<'PY'
          import ast, pathlib, sys
          errors = []
          checked = 0
          for p in pathlib.Path('.').rglob('*.py'):
              if '.git' in p.parts or '__pycache__' in p.parts:
                  continue
              checked += 1
              try:
                  ast.parse(p.read_text(encoding='utf-8'), filename=str(p))
              except Exception as e:
                  errors.append(f'{p}: {type(e).__name__}: {e}')
          print(f'Parsed {checked} Python files')
          for e in errors:
              print(f'ERROR: {e}')
          sys.exit(1 if errors else 0)
          PY

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: Go syntax
        run: |
          fail=0
          while IFS= read -r f; do
            gofmt -e "$f" > /dev/null || { echo "ERROR: $f"; fail=1; }
          done < <(find . -name '*.go' -not -path './.git/*')
          exit $fail

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: TypeScript syntax
        run: |
          fail=0
          for f in $(find . -name '*.ts' -not -path './.git/*'); do
            npx --yes esbuild "$f" --outfile=/dev/null || { echo "ERROR: $f"; fail=1; }
          done
          exit $fail

  # ── Examples must import and parse under a real ADK install ──
  validate-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install latest ADK
        run: pip install "google-adk>=2.12.0,<3" pyyaml

      - name: Examples import cleanly
        run: |
          python - <<'PY'
          import pathlib, sys, yaml
          sys.path.insert(0, 'examples')

          import bidi_orchestrator
          print('bidi_orchestrator import: OK')

          cfg = yaml.safe_load(
              pathlib.Path('examples/bidi_orchestrator/root_agent.yaml').read_text()
          )
          for key in ('name', 'model', 'agents'):
              assert key in cfg, f'root_agent.yaml missing {key!r}'
          print('root_agent.yaml shape: OK')
          PY

  # ── ADK version matrix ──
  version-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        adk: ["2.9.2", "2.10.0", "2.11.0", "2.12.0"]
        python: ["3.10", "3.11", "3.12", "3.13"]
        exclude:
          # 2.12.0 raised the floor to Python 3.11
          - adk: "2.12.0"
            python: "3.10"
    name: adk ${{ matrix.adk }} / py ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install ADK ${{ matrix.adk }}
        run: pip install "google-adk==${{ matrix.adk }}"

      - name: Verify core surface imports
        run: |
          python - <<'PY'
          import google.adk

          # Core agent + workflow surface
          from google.adk.agents import LlmAgent, SequentialAgent, ParallelAgent, LoopAgent

          # Skills subsystem: the headline 2.x feature
          from google.adk.skills import (
              Skill, Frontmatter, Resources, Script, SkillRegistry,
              load_skill_from_dir, load_skills_from_dir, list_skills_in_dir,
          )
          from google.adk.tools.skill_toolset import SkillToolset

          print(f'google-adk {google.adk.__version__}: core + skills surface OK')
          PY

  # ── Security: secret scanning ──
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned to commit SHA for supply-chain security
      - uses: gitleaks/gitleaks-action@aa6c132071730e14d28e89080e0adeebc4df4512  # v2.1.0
